<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>팀원 시간표 · 테무테무</title>
<link rel="stylesheet" href="/task-common.css">
<style>
  main { max-width:780px; margin:0 auto; padding:40px 16px 80px; }
  .back { color:var(--muted); text-decoration:none; font-size:14px; }
  .back:hover { color:var(--fg); }
  h1 { font-size:32px; line-height:1.15; font-weight:800; letter-spacing:-.03em; margin:14px 0 6px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .tabs button { font:inherit; font-size:14px; padding:6px 12px; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:999px; cursor:pointer; }
  .tabs button:hover { border-color:var(--muted); }
  .tabs button[aria-selected="true"] { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .grid { display:grid; grid-template-columns:36px repeat(5, 1fr); border:1px solid var(--line); border-radius:6px; overflow:hidden; position:relative; }
  .head { font-size:13px; color:var(--muted); text-align:center; padding:6px 0; border-bottom:1px solid var(--line); background:var(--soft); }
  .times { position:relative; border-right:1px solid var(--line); }
  .times span { position:absolute; right:4px; font-size:11px; color:var(--muted); transform:translateY(-1px); }
  .col { position:relative; border-left:1px solid var(--line); }
  .col:first-of-type { border-left:0; }
  .hr { position:absolute; left:0; right:0; border-top:1px solid var(--line); }
  .blk { position:absolute; left:2px; right:2px; border-radius:4px; box-shadow:inset 3px 0 0 rgba(0,0,0,.14); padding:4px 5px; font-size:12px; line-height:1.25; overflow:hidden; color:#1c1917; }
  .blk b { display:block; font-weight:600; word-break:keep-all; }
  .blk small { opacity:.75; }
  .cell { position:absolute; left:0; right:0; display:flex; align-items:flex-start; justify-content:flex-start; padding:3px 6px; font-size:11px; font-variant-numeric:tabular-nums; cursor:pointer; }
  .cell.free { font-weight:600; }
  input[type=checkbox] { accent-color:var(--fg); }
  .online { margin-top:14px; font-size:14px; color:var(--muted); }
  .legend { display:flex; gap:14px; align-items:center; font-size:13px; color:var(--muted); margin:0 0 10px; flex-wrap:wrap; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:4px; }
  .note { font-size:13px; color:var(--muted); margin-top:10px; }
  .include { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted); margin:0 0 10px; }
  .include label { display:flex; align-items:center; gap:4px; cursor:pointer; }
  .blk .x { position:absolute; top:2px; right:3px; border:0; background:rgba(0,0,0,.12); color:#1c1917; border-radius:4px; font-size:12px; line-height:1; padding:3px 5px; cursor:pointer; }
  .editor { margin-top:14px; padding:14px; border:1px solid var(--line); border-radius:10px; display:grid; gap:10px; }
  .editor .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .editor .row > * { flex:1 1 90px; min-width:0; }
  .editor .row .btn { flex:0 0 auto; }
  .editor label { font-size:13px; color:var(--muted); }
  .tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
</style>
</head>
<body>
<main>
  <div class="bar" id="bar"></div>
  <a class="back" href="/task.html">← 테무테무 자료실</a>
  <h1>팀원 시간표</h1>
  <p class="sub">2026년 2학기 · 8명 · 월–금. 비는 시간을 찾거나, 로그인해서 내 시간표를 고칠 수 있어요.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="legend"></div>
  <div class="grid" id="grid"></div>
  <div class="online" id="online"></div>
  <div id="tools"></div>
  <p class="note" id="note"></p>
</main>
<script src="/task-common.js"></script>
<script>
const { esc, api, onAuth, mountBar } = window.Task;
const DAYS = ["월","화","수","목","금"];
const START = 8.5, END = 21, PX = 44; // px per hour
const PALETTE = ["#f4b4a4","#f7d58b","#b9dc9b","#9fd8c8","#a9c1f0","#d3b5ec","#f5b8cf","#c9d3a0","#f2c79e","#a8d4ea"];
const toH = t => { const [h,m] = t.split(":").map(Number); return h + m/60; };
const y = h => (h - START) * PX;
const colorOf = name => { let s = 0; for (const c of name) s = (s*31 + c.charCodeAt(0)) >>> 0; return PALETTE[s % PALETTE.length]; };
const $ = id => document.getElementById(id);

let PEOPLE = [];          // [{ id, name, classes:[{day,start,end,name,room,est}], online:[] }]
let me = null;            // logged-in member { id, name }
let current = "all";      // "all" or member id
let draft = null;         // editable copy of my timetable while editing
const included = new Set();

function frame() {
  const g = $("grid");
  g.innerHTML = '<div class="head"></div>' + DAYS.map(d => `<div class="head">${d}</div>`).join("");
  const H = (END - START) * PX;
  const times = document.createElement("div"); times.className = "times"; times.style.height = H + "px";
  for (let h = 9; h <= END; h++) times.insertAdjacentHTML("beforeend", `<span style="top:${y(h)}px">${h}</span>`);
  g.appendChild(times);
  return DAYS.map(() => {
    const c = document.createElement("div"); c.className = "col"; c.style.height = H + "px";
    for (let h = 9; h < END; h++) c.insertAdjacentHTML("beforeend", `<div class="hr" style="top:${y(h)}px"></div>`);
    g.appendChild(c); return c;
  });
}

function showPerson(p) {
  const cols = frame();
  const editing = draft && me && me.id === p.id;
  const data = editing ? draft : p;
  data.classes.forEach((k, i) => {
    const top = y(Math.max(toH(k.start), START)), h = (Math.min(toH(k.end), END) - Math.max(toH(k.start), START)) * PX;
    if (h <= 0) return;
    cols[k.day].insertAdjacentHTML("beforeend",
      `<div class="blk" style="top:${top+1}px;height:${h-2}px;background:${colorOf(k.name)}" title="${esc(k.name)} ${k.start}–${k.end}">
        <b>${esc(k.name)}</b><small>${k.start}–${k.end}${k.est ? "?" : ""}${k.room ? " · " + esc(k.room) : ""}</small>
        ${editing ? `<button class="x" data-rm="${i}" aria-label="삭제">×</button>` : ""}</div>`);
  });
  $("legend").innerHTML = "";
  $("online").textContent = data.online.length ? "온라인 강의: " + data.online.join(" · ") : "";
  const guessed = data.classes.some(k => k.est);
  $("note").textContent = !data.classes.length && !editing ? "아직 시간표를 입력하지 않았어요." : guessed ? "? 표시는 끝나는 시간을 짐작해서 넣은 거예요." : "";
  renderTools(p);
}

function renderTools(p) {
  const t = $("tools");
  if (!me || me.id !== p.id) { t.innerHTML = ""; return; }
  if (!draft) {
    t.innerHTML = `<div class="tools"><button class="btn primary" data-act="edit">내 시간표 고치기</button></div>`;
    return;
  }
  t.innerHTML = `<div class="editor">
      <label>수업 추가</label>
      <div class="row">
        <select id="f-day">${DAYS.map((d, i) => `<option value="${i}">${d}</option>`).join("")}</select>
        <input id="f-start" type="time" value="12:00" step="900" aria-label="시작">
        <input id="f-end" type="time" value="13:30" step="900" aria-label="끝">
      </div>
      <div class="row">
        <input id="f-name" placeholder="과목·일정 이름" maxlength="40">
        <input id="f-room" placeholder="강의실 (선택)" maxlength="20">
        <button class="btn" data-act="add">추가</button>
      </div>
      <label for="f-online">온라인 강의 (쉼표로 구분)</label>
      <input id="f-online" value="${esc(draft.online.join(", "))}">
      <div class="row">
        <button class="btn primary" data-act="save">저장</button>
        <button class="btn" data-act="cancel">취소</button>
      </div>
      <span class="err" id="f-err" role="alert"></span>
    </div>`;
}

function showAll() {
  const cols = frame();
  const STEP = 0.5;
  const group = PEOPLE.filter(p => included.has(p.id));
  for (let d = 0; d < 5; d++) {
    let prev = null;
    for (let t = START; t < END; t += STEP) {
      const busy = group.filter(p => p.classes.some(k => k.day === d && toH(k.start) < t + STEP && toH(k.end) > t)).map(p => p.name);
      const free = group.length - busy.length;
      let bg = "transparent", fg = "var(--muted)", label = "";
      if (!group.length) label = "";
      else if (busy.length === 0) { bg = "var(--free)"; fg = "var(--free-fg)"; label = "모두 빔"; }
      else { bg = `rgba(232,89,12,${0.06 + busy.length / group.length * 0.5})`; fg = "var(--fg)"; label = `${free}/${group.length}`; }
      // Only label the first slot of a run so the grid reads as blocks, not a wall of numbers.
      const key = busy.join(",");
      const text = t >= 9 && key !== prev ? label : "";
      if (t >= 9) prev = key;
      const tip = busy.length ? "수업 중: " + busy.join(", ") : "모두 비는 시간";
      cols[d].insertAdjacentHTML("beforeend",
        `<div class="cell${busy.length === 0 && group.length ? " free" : ""}" style="top:${y(t)+1}px;height:${STEP*PX-1}px;background:${bg};color:${fg}" title="${esc(tip)}">${text}</div>`);
    }
  }
  $("legend").innerHTML =
    `<div class="include">같이 볼 사람 ${PEOPLE.map(p => `<label><input type="checkbox" data-inc="${esc(p.id)}" ${included.has(p.id) ? "checked" : ""}>${esc(p.name)}${p.classes.length ? "" : " (미입력)"}</label>`).join("")}</div>
     <div class="legend"><span><i class="sw" style="background:var(--free)"></i>모두 비는 시간</span>
     <span><i class="sw" style="background:rgba(232,89,12,.35)"></i>진할수록 수업 있는 사람이 많음</span><span>숫자 = 빈 사람 수</span></div>`;
  $("online").textContent = "";
  $("tools").innerHTML = "";
  $("note").textContent = "칸을 누르면 그 시간에 수업 있는 사람이 나와요. 온라인 강의는 계산에서 빠져 있어요.";
}

function render() {
  if (current === "all") showAll();
  else showPerson(PEOPLE.find(p => p.id === current));
}

function renderTabs() {
  const tabs = $("tabs");
  const views = [{ id: "all", label: "전체 · 빈 시간" }, ...PEOPLE.map(p => ({ id: p.id, label: p.name }))];
  tabs.innerHTML = views.map(v => `<button role="tab" data-tab="${esc(v.id)}" aria-selected="${v.id === current}">${esc(v.label)}</button>`).join("");
}

$("tabs").addEventListener("click", e => {
  const id = e.target.dataset.tab; if (!id) return;
  current = id; draft = null; renderTabs(); render();
});
$("legend").addEventListener("change", e => {
  const id = e.target.dataset.inc; if (!id) return;
  e.target.checked ? included.add(id) : included.delete(id); render();
});
$("grid").addEventListener("click", e => {
  const rm = e.target.dataset.rm;
  if (rm !== undefined && draft) { draft.classes.splice(Number(rm), 1); render(); return; }
  const c = e.target.closest(".cell"); if (c) $("note").textContent = c.title;
});
$("tools").addEventListener("click", async e => {
  const act = e.target.dataset.act; if (!act) return;
  const mine = PEOPLE.find(p => p.id === me.id);
  const err = () => $("f-err");
  if (act === "edit") { draft = structuredClone({ classes: mine.classes, online: mine.online }); render(); }
  if (act === "cancel") { draft = null; render(); }
  if (act === "add") {
    const k = { day: Number($("f-day").value), start: $("f-start").value, end: $("f-end").value, name: $("f-name").value.trim(), room: $("f-room").value.trim() };
    if (!k.name) { err().textContent = "과목 이름을 입력해 주세요."; return; }
    if (!k.start || !k.end || k.start >= k.end) { err().textContent = "끝나는 시간이 시작 시간보다 늦어야 해요."; return; }
    const online = $("f-online").value;
    draft.classes.push(k); render(); $("f-online").value = online;
  }
  if (act === "save") {
    draft.online = $("f-online").value.split(",").map(s => s.trim()).filter(Boolean);
    e.target.disabled = true;
    try {
      await api("/api/task/timetables", { method: "PUT", body: JSON.stringify(draft) });
      mine.classes = draft.classes; mine.online = draft.online;
      if (mine.classes.length) included.add(mine.id);
      draft = null; render();
      $("note").textContent = "저장했어요.";
    } catch (ex) { err().textContent = ex.message; e.target.disabled = false; }
  }
});

async function load() {
  try {
    const r = await api("/api/task/timetables");
    PEOPLE = r.people;
    PEOPLE.forEach(p => p.classes.length && included.add(p.id));
  } catch (ex) {
    $("note").textContent = ex.message;
  }
  renderTabs(); render();
}

onAuth(m => { me = m; draft = null; if (PEOPLE.length) render(); });
mountBar($("bar"));
load();
</script>
</body>
</html>
