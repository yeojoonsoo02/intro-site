<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TemuTemu Docs</title>
<link rel="stylesheet" href="/task-common.css">
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:56px 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 28px; font-size:14px; }
  a { display:flex; justify-content:space-between; gap:12px; padding:16px 0; border-top:1px solid var(--line); color:inherit; text-decoration:none; }
  .list a:last-child { border-bottom:1px solid var(--line); }
  h2 { font-size:13px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:32px 0 4px; }
  a:hover span:first-child { text-decoration:underline; }
  small { color:var(--muted); white-space:nowrap; }
  .file { display:flex; align-items:center; gap:12px; padding:14px 0; border-top:1px solid var(--line); }
  .file:last-child { border-bottom:1px solid var(--line); }
  .file a { display:block; flex:1; min-width:0; padding:0; border:0; overflow-wrap:anywhere; }
  .file a:hover { text-decoration:underline; }
  .file .linkbtn { font-size:13px; }
  .uploader { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0 4px; }
  .uploader input[type=file] { flex:1 1 200px; min-width:0; }
  .preview { position:fixed; z-index:10; width:280px; max-height:380px; overflow:hidden; background:var(--bg); border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.18); padding:8px; pointer-events:none; opacity:0; transition:opacity .12s; }
  .preview.on { opacity:1; }
  .preview canvas, .preview img { display:block; width:100%; height:auto; border-radius:4px; }
  .preview pre { margin:0; font:11px/1.45 ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-all; color:var(--fg); max-height:360px; overflow:hidden; }
  .preview .msg { font-size:12px; color:var(--muted); padding:20px 0; text-align:center; }
  .empty { color:var(--muted); font-size:14px; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <div class="bar" id="bar"></div>
  <h1>TemuTemu</h1>
  <p>Technology &amp; Management team project · Kwangwoon Univ.</p>
  <h2>Meeting Notes</h2>
  <div class="list">
    <a href="/task.pdf"><span>Meeting Minutes #1</span><small>Sep 17, 2026 · PDF</small></a>
    <a href="/task-transcript.txt"><span>Meeting #1 Transcript</span><small>Sep 17, 2026 · TXT</small></a>
  </div>
  <h2>Slides</h2>
  <div class="list">
    <a href="/task-proposal.pdf"><span>Project Proposal</span><small>Sep 17, 2026 · PDF</small></a>
  </div>
  <h2>Schedule</h2>
  <div class="list">
    <a href="/task-schedule.pdf"><span>Project Schedule</span><small>v2 · PDF</small></a>
    <a href="/task-timetable.html"><span>Team Timetables</span><small>8 members · Web</small></a>
  </div>
  <h2>Shared Files</h2>
  <form class="uploader" id="uploader" hidden>
    <input type="file" name="file" required aria-label="File">
    <button class="btn primary" type="submit">Upload</button>
    <span class="err" role="alert"></span>
  </form>
  <div id="files"><div class="empty">Loading…</div></div>
</main>
<script src="/task-common.js"></script>
<script type="module">
import { upload } from 'https://cdn.jsdelivr.net/npm/@vercel/blob@2.8.0/client/+esm';
const { esc, api, onAuth, mountBar, state } = window.Task;
const filesEl = document.getElementById('files');
const form = document.getElementById('uploader');

const fmtSize = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const fmtDate = (t) => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

async function loadFiles() {
  try {
    const { files } = await api('/api/task/files');
    filesEl.innerHTML = files.length ? files.map((f) => `<div class="file">
        <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>
        <small>${esc(f.uploaderName)} · ${fmtDate(f.createdAt)} · ${fmtSize(f.size)}</small>
        ${state.me && state.me.id === f.uploader ? `<button class="linkbtn" data-del="${esc(f.id)}">Delete</button>` : ''}
      </div>`).join('') : '<div class="empty">No files yet. Log in to upload.</div>';
  } catch (e) {
    filesEl.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

filesEl.addEventListener('click', async (e) => {
  const id = e.target.dataset.del;
  if (!id) return;
  e.target.disabled = true;
  try { await api('/api/task/files?id=' + encodeURIComponent(id), { method: 'DELETE' }); } catch (ex) { e.target.textContent = ex.message; return; }
  loadFiles();
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = form.file.files[0];
  const btn = form.querySelector('button');
  const err = form.querySelector('.err');
  if (!file) return;
  if (file.size > 50 * 1024 * 1024) { err.textContent = 'Max file size is 50 MB.'; return; }
  err.textContent = '';
  btn.disabled = true; btn.textContent = 'Uploading…';
  try {
    const blob = await upload('task/' + file.name, file, { access: 'public', handleUploadUrl: '/api/task/upload' });
    await api('/api/task/files', { method: 'POST', body: JSON.stringify({ url: blob.url, name: file.name }) });
    form.reset();
    loadFiles();
  } catch (ex) {
    err.textContent = ex.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Upload';
  }
});

onAuth((me) => { form.hidden = !me; loadFiles(); });

// Hover preview: first page of PDFs, first lines of text files, images as-is. Mouse only (touch just opens).
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/';
const kindOf = (href) => {
  const ext = (href.split('?')[0].split('.').pop() || '').toLowerCase();
  return ext === 'pdf' ? 'pdf' : ext === 'txt' || ext === 'md' || ext === 'csv' ? 'text' : ['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext) ? 'image' : null;
};
const tip = document.createElement('div');
tip.className = 'preview';
document.body.appendChild(tip);
const cache = new Map();   // href -> Promise<HTMLElement>
let pdfjs = null, current = null;

async function loadPdfjs() {
  if (!pdfjs) {
    pdfjs = await import(PDFJS + 'pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.mjs';
  }
  return pdfjs;
}

async function build(href, kind) {
  if (kind === 'image') {
    const img = new Image(); img.src = href; await img.decode(); return img;
  }
  if (kind === 'text') {
    const pre = document.createElement('pre');
    pre.textContent = (await (await fetch(href)).text()).split('\n').slice(0, 28).join('\n');
    return pre;
  }
  const lib = await loadPdfjs();
  const task = lib.getDocument({ url: new URL(href, location.href).href });
  const doc = await task.promise;
  const page = await doc.getPage(1);
  const base = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: (264 / base.width) * (window.devicePixelRatio || 1) });
  const canvas = document.createElement('canvas');
  canvas.width = vp.width; canvas.height = vp.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  task.destroy();
  return canvas;
}

function place(x, y) {
  const w = 298, h = tip.offsetHeight || 380;
  const left = x + 20 + w > innerWidth ? Math.max(8, x - w - 12) : x + 20;
  const top = Math.min(Math.max(8, y - 40), innerHeight - h - 8);
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}

if (matchMedia('(hover: hover)').matches) {
  document.querySelector('main').addEventListener('mouseover', async (e) => {
    const a = e.target.closest('a[href]');
    if (!a || a === current) return;
    const href = a.getAttribute('href');
    const kind = kindOf(href);
    if (!kind) return;
    current = a;
    tip.innerHTML = '<div class="msg">Loading preview…</div>';
    tip.classList.add('on');
    place(e.clientX, e.clientY);
    if (!cache.has(href)) cache.set(href, build(href, kind).catch(() => null));
    const el = await cache.get(href);
    if (current !== a) return;
    tip.innerHTML = '';
    if (el) tip.appendChild(el instanceof HTMLCanvasElement ? copyCanvas(el) : el.cloneNode(true));
    else tip.innerHTML = '<div class="msg">Preview not available</div>';
    place(e.clientX, e.clientY);
  });
  document.querySelector('main').addEventListener('mousemove', (e) => { if (current) place(e.clientX, e.clientY); });
  document.querySelector('main').addEventListener('mouseout', (e) => {
    const a = e.target.closest('a[href]');
    if (a && a === current && !a.contains(e.relatedTarget)) { current = null; tip.classList.remove('on'); }
  });
}

function copyCanvas(src) {
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  c.getContext('2d').drawImage(src, 0, 0);
  return c;
}
mountBar(document.getElementById('bar'));
</script>
</body>
</html>
